# Project-wide Gradle settings.

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Workaround for JdkImageTransform / jlink issues
android.jdk.category=jdk
# ????????????????????????????????????????????????????????????????
# Gradle Memory Settings
# ????????????????????????????????????????????????????????????????

# Increase JVM heap size for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Enable build cache
org.gradle.caching=true

# Enable configuration cache (optional)
# org.gradle.configuration-cache=true

# Kotlin daemon settings
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Disable Kotlin daemon fallback (helps with stability)
kotlin.daemon.useFallbackStrategy=false

# Enable incremental compilation
kotlin.incremental=true

# Use K2 compiler (Kotlin 2.0+, optional)
# kotlin.experimental.tryK2=true
